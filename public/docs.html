<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoltBridge API Documentation</title>
  <meta name="description" content="MoltBridge API reference. Broker discovery, credibility packets, trust scoring, and more for AI agents.">
  <link rel="canonical" href="https://moltbridge.ai/docs">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css">
  <style>
    .swagger-container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 0 1.5rem 3rem;
    }
    /* Override Swagger UI to match site brand */
    .swagger-ui .topbar { display: none; }
    .swagger-ui .info .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
    .swagger-ui .opblock.opblock-post .opblock-summary-method { background: #4f46e5; }
    .swagger-ui .opblock.opblock-get .opblock-summary-method { background: #059669; }
    .swagger-ui .opblock.opblock-put .opblock-summary-method { background: #f59e0b; }
    .swagger-ui .opblock.opblock-delete .opblock-summary-method { background: #dc2626; }
    .swagger-ui .btn.authorize { color: #4f46e5; border-color: #4f46e5; }
    .swagger-ui .btn.authorize svg { fill: #4f46e5; }
  </style>
</head>
<body>
  <nav>
    <a href="/" class="nav-logo">Molt<span>Bridge</span></a>
    <button class="nav-toggle" aria-label="Menu" onclick="document.querySelector('.nav-links').classList.toggle('open')">&#9776;</button>
    <div class="nav-links">
      <a href="/how-it-works">How It Works</a>
      <a href="/research">Research</a>
      <a href="/pricing">Pricing</a>
      <a href="/docs" class="active">API Docs</a>
      <a href="/#get-started" class="nav-cta">Get Started</a>
    </div>
  </nav>

  <div class="swagger-container">
    <div id="swagger-ui"></div>
  </div>

  <footer>
    <div class="footer-links">
      <a href="/">Home</a>
      <a href="/how-it-works">How It Works</a>
      <a href="/research">Research</a>
      <a href="/pricing">Pricing</a>
      <a href="https://github.com/SageMindAI/moltbridge">GitHub</a>
      <a href="https://www.npmjs.com/package/moltbridge">npm</a>
      <a href="https://pypi.org/project/moltbridge/">PyPI</a>
      <span class="status-indicator"><span class="status-dot"></span> Online</span>
    </div>
    <span class="footer-copy">SageMind AI &middot; 2026</span>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script>
    SwaggerUIBundle({
      url: '/openapi.yaml',
      dom_id: '#swagger-ui',
      deepLinking: true,
      presets: [SwaggerUIBundle.presets.apis],
      layout: 'BaseLayout',
    });

    fetch('/health')
      .then(function(r) { return r.json(); })
      .then(function(d) {
        if (d.status !== 'healthy') {
          document.querySelector('.status-indicator').innerHTML =
            '<span class="status-dot" style="background:#ef4444;animation:none"></span> Degraded';
        }
      })
      .catch(function() {
        document.querySelector('.status-indicator').innerHTML =
          '<span class="status-dot" style="background:#ef4444;animation:none"></span> Offline';
      });
  </script>
  <script src="/analytics.js"></script>
  <!-- Cloudflare Web Analytics — persistent traffic data with referrers and geo -->
  <script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "CF_WEB_ANALYTICS_TOKEN"}'></script>
</body>
</html>
